<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T13 Invoice Styles — one invoice, three looks</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the component from source/, dressed in Nocturne type */
  #stage{background:radial-gradient(ellipse 65% 60% at 50% 50%,#0E1018 0%,var(--void) 72%);
    --font:var(--f-text);--mono:var(--f-mono);--display:var(--f-display)}
  #stage .iv{position:absolute;left:130px;top:62px;zoom:1;z-index:1}
  #stage .iv-switch button.li-hover:not([aria-selected="true"]){color:var(--text)}
  #stage .is-block .iv-qty button.li-hover{background:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div id="stage" class="grid" data-title="T13 Invoice Styles" data-url="veraetogrex-portfolio.github.io/invoice-styles">
  <section class="iv is-paper" id="invoice" aria-label="Invoice in three styles">
    <div class="iv-switch" role="tablist" aria-label="Invoice style">
      <span class="iv-thumb"></span>
      <button role="tab" data-style="paper" aria-selected="true">Paper</button>
      <button role="tab" data-style="block">Block</button>
      <button role="tab" data-style="term">Terminal</button>
    </div>

    <div class="iv-sheet"></div>

    <h1 class="iv-part iv-title"><span class="iv-prompt">$ </span>Invoice <b>0118</b></h1>
    <div class="iv-part iv-meta">
      <p><span>From</span>Nocturne Studio</p>
      <p><span>To</span>Halden Robotics</p>
      <p><span>Due</span>Dec 1, 2026</p>
    </div>
    <div class="iv-part iv-items">
      <div class="iv-row" data-price="480"><span class="iv-name">Design review</span><span class="iv-qty"><button class="iv-dec" aria-label="Less">−</button><b>2</b><button class="iv-inc" aria-label="More">+</button></span><span class="iv-sum"></span></div>
      <div class="iv-row" data-price="1200"><span class="iv-name">Prototype sprint</span><span class="iv-qty"><button class="iv-dec" aria-label="Less">−</button><b>1</b><button class="iv-inc" aria-label="More">+</button></span><span class="iv-sum"></span></div>
      <div class="iv-row" data-price="320"><span class="iv-name">Motion pass</span><span class="iv-qty"><button class="iv-dec" aria-label="Less">−</button><b>1</b><button class="iv-inc" aria-label="More">+</button></span><span class="iv-sum"></span></div>
    </div>
    <div class="iv-part iv-total"><span class="iv-total-label">Total</span><span class="iv-odo" aria-live="polite"></span></div>
    <button class="iv-part iv-dl">Download PDF</button>
  </section>
  <div class="status-line"><span>Veraetogrex · T13</span><span>Billing · invoice 0118</span></div>
</div>

<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const iv = document.querySelector('#invoice').invoice;
const tab = s => document.querySelector(`.iv-switch [data-style="${s}"]`);
const row0 = document.querySelector('.iv-row');
const START = [1180, 820];
Stage.init({
  reset: () => iv.reset(),
  cursorStart: START,
  async demo(s) {
    const t0 = performance.now();
    await s.wait(80);
    await s.click(tab('block'), { ms: 440 });                 // ≈0.5 receipt → colour block, total spins
    await s.until(t0, 1450);
    await s.click(row0.querySelector('.iv-inc'), { ms: 420 }); // ≈1.9 2 → 3 seats: $2,480 → $2,960
    await s.until(t0, 2450);
    await s.click(row0.querySelector('.iv-dec'), { ms: 260 }); // ≈2.7 and back
    await s.until(t0, 3250);
    await s.click(tab('term'), { ms: 480 });                  // ≈3.7 terminal types itself out
    await s.until(t0, 4950);
    await s.click(tab('paper'), { ms: 460 });                 // ≈5.4 back to the receipt = first frame
    await s.until(t0, 6000);
    await s.move(START, 520, { arc: -.1 });
    await s.until(t0, 6700);
  },
});
</script>
</body>
</html>
